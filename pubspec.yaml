name: qr_studio
description: A professional QR code generator with templates, customization, and quality scoring.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  path_provider: ^2.1.0
  share_plus: ^10.1.4
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
